services:
  app:
    build: ./app
    container_name: voyageops-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/voyageops
      - DB_USERNAME=voyageops
      - DB_PASSWORD=voyageops
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - INTEGRATION_OPENTRIPMAP_API_KEY=${INTEGRATION_OPENTRIPMAP_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  postgres:
    image: postgres:17-alpine
    container_name: voyageops-postgres
    environment:
      - POSTGRES_DB=voyageops
      - POSTGRES_USER=voyageops
      - POSTGRES_PASSWORD=voyageops
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voyageops -d voyageops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: voyageops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data: