spring:
  application:
    name: voyageops

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/voyageops}
    username: ${DB_USERNAME:voyageops}
    password: ${DB_PASSWORD:voyageops}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    default-property-inclusion: non_null

  http:
    client:
      connect-timeout: 3s
      read-timeout: 5s

integration:
  opentripmap:
    api-key: ${INTEGRATION_OPENTRIPMAP_API_KEY:}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.voyageops: INFO